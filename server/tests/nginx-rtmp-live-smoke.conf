worker_processes 1;
error_log /dev/stderr notice;
events { worker_connections 1024; }
rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      notify_method post;
      on_publish http://host.docker.internal:3099/api/streams/publish;
      on_publish_done http://host.docker.internal:3099/api/streams/publish_done;
    }
    application sink { live on; record off; }
  }
}
http { server { listen 8080; location /healthz { return 200 "ok\n"; } } }
