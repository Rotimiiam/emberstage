# Fresh dedicated host only. The distro module loader supplies nginx-rtmp.
include /etc/nginx/modules-enabled/*.conf;
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
rtmp {
    server {
        listen 127.0.0.1:1935;
        chunk_size 4096;
        application live {
            live on;
            record off;
            notify_method post;
            allow play 127.0.0.1;
            deny play all;
            on_publish http://127.0.0.1:3000/api/streams/publish;
            on_publish_done http://127.0.0.1:3000/api/streams/publish_done;
        }
    }
}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    server {
        listen 80 default_server;
        server_name _;
        location / { return 404; }
    }
    server {
        listen 80;
        server_name account.emberstage.live;
        location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / { return 308 https://account.emberstage.live$request_uri; }
    }
    server {
        listen 80;
        server_name live.emberstage.live;
        location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / { return 404; }
    }
    include /etc/nginx/emberstage-tls.conf;
}
