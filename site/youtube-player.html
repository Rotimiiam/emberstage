<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Emberstage YouTube player</title>
  <style>html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0}</style>
</head>
<body>
  <div id="player"></div>
  <script>
    // OBS keeps iframe audio even when the dock pauses the outer page. Mute every
    // nested media element as soon as the parent asks, before the API command lands.
    addEventListener('message', event => {
      const data = event.data;
      if (event.source !== parent || !data || data.channel !== 'emberstage-youtube-audio') return;
      for (const media of document.querySelectorAll('audio, video, iframe')) {
        try { media.muted = true; media.volume = 0; media.pause?.(); } catch (_) {}
      }
    });
  </script>
  <script src="youtube-player.js"></script>
</body>
</html>
