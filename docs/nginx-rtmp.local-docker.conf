# Local Docker Desktop ingest configuration for Emberstage development.
# The control plane stays bound to the host loopback interface.

# Keep local publishers and relay subscribers in the same worker.
worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            notify_method post;

            allow play 127.0.0.1;
            # Host relays reach this loopback-published port through the Docker bridge.
            allow play 172.17.0.1;
            deny play all;

            on_publish http://host.docker.internal:3000/api/streams/publish;
            on_publish_done http://host.docker.internal:3000/api/streams/publish_done;
        }
    }
}

http {
    server {
        listen 8080;
        location /healthz {
            return 200 "ok\n";
        }
    }
}
