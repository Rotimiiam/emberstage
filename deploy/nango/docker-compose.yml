services:
  nango-db:
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: nango
      POSTGRES_DB: nango
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
    volumes:
      - ./nango-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango -d nango"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nango-redis:
    image: redis:7.2.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  nango-server:
    image: nangohq/nango-server@sha256:2a640c6a0e9990aed33ef0a897511464c1f92b8f6171af8dda7eb94710804d89
    platform: linux/amd64
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: nango
      NANGO_DB_SSL: "false"
      RECORDS_DATABASE_URL: postgresql://nango:${NANGO_DB_PASSWORD}@nango-db:5432/nango
      SERVER_PORT: "3003"
      CONNECT_UI_PORT: "3009"
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://127.0.0.1:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:-http://127.0.0.1:3003}
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:-http://127.0.0.1:3009}
      FLAG_SERVE_CONNECT_UI: "true"
      FLAG_AUTH_ENABLED: "true"
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD}
      NANGO_LOGS_ENABLED: "false"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3009:3009"
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_started
    restart: unless-stopped
